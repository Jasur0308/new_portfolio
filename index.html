      --mu: #6a6590;

    @media (prefers-color-scheme:dark) {

        --bg: #0b0a1a;
        --card: rgba(255, 255, 255, .05);
        --bd: rgba(255, 255, 255, .1);
        --tx: #f1eeff;
        --mu: #9d98c4;
        --sh: 0 10px 40px rgba(0, 0, 0, .4);
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b0a1a;
      --card: rgba(255, 255, 255, .05);
      --bd: rgba(255, 255, 255, .1);
      --tx: #f1eeff;
      --mu: #9d98c4;
      --sh: 0 10px 40px rgba(0, 0, 0, .4);
      color-scheme: dark
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      overflow-x: hidden;
      line-height: 1.6
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .45;
      z-index: 0;
      animation: float 14s ease-in-out infinite
    }

    .b1 {
      width: 420px;
      height: 420px;
      background: var(--a);
      top: -100px;
      left: -100px
    }

    .b2 {
      width: 360px;
      height: 360px;
      background: var(--b);
      right: -80px;
      top: 35%;
      animation-delay: -5s
    }

    .b3 {
      width: 320px;
      height: 320px;
      background: var(--c);
      left: 30%;
      bottom: -120px;
      animation-delay: -9s
    }

    @keyframes float {
      50% {
        transform: translate(40px, -50px) scale(1.12)
      }
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: radial-gradient(var(--bd) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none
    }

    #root {
      position: relative;
      z-index: 1
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px
    }

    nav {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      margin: 14px auto;
      max-width: 1080px;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 100px;
      backdrop-filter: blur(14px)
    }

    nav a {
      color: var(--mu);
      text-decoration: none;
      margin-left: 16px;
      font-size: .9rem
    }

    nav a:hover {
      color: var(--a)
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(135deg, var(--a), var(--c));
      padding: 6px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(109, 74, 255, .35)
    }

    button.t {
      background: none;
      border: 1px solid var(--bd);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      cursor: pointer;
      margin-left: 14px;
      color: var(--tx)
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
      align-items: center;
      padding: 70px 0 60px
    }

    .tag {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      padding: 6px 14px;
      border-radius: 100px;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--b)
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      line-height: 1.05;
      margin: 18px 0
    }

    .grad {
      background: linear-gradient(90deg, var(--a), var(--c), var(--b));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .hero p {
      color: var(--mu);
      font-size: 1.1rem;
      max-width: 520px
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 600;
      margin: 8px 10px 0 0;
      transition: .25s
    }

    .p {
      background: linear-gradient(90deg, var(--a), var(--c));
      color: #fff;
      box-shadow: 0 8px 24px rgba(109, 74, 255, .35)
    }

    .s {
      border: 1px solid var(--bd);
      color: var(--tx);
      background: var(--card)
    }

    .btn:hover {
      transform: translateY(-3px)
    }

    .glass {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 22px;
      box-shadow: var(--sh);
      backdrop-filter: blur(12px)
    }

    .viz {
      padding: 20px
    }

    .viz svg {
      width: 100%;
      height: auto;
      display: block
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
      text-align: center
    }

    .stats b {
      font-size: 1.5rem;
      display: block
    }

    .stats span {
      color: var(--mu);
      font-size: .8rem
    }

    section {
      padding: 50px 0
    }

    h2 {
      font-size: 2rem;
      margin: 0 0 28px
    }

    h2::after {
      content: "";
      display: block;
      width: 56px;
      height: 4px;
      border-radius: 4px;
      margin-top: 8px;
      background: linear-gradient(90deg, var(--a), var(--b))
    }

    .skills {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px
    }

    .sk {
      padding: 22px
    }

    .sk h3 {
      margin: 0 0 12px;
      font-size: 1.05rem
    }

    .chip {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      padding: 4px 11px;
      margin: 3px;
      border-radius: 100px;
      background: rgba(109, 74, 255, .12);
      color: var(--a)
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px
    }

    .pr {
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: .3s;
      position: relative;
      overflow: hidden;
      display: block
    }

    .pr:hover {
      transform: translateY(-6px) rotate(-.4deg);
      border-color: var(--a)
    }

    .pr::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: var(--g)
    }

    .pr h3 {
      margin: 6px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.02rem
    }

    .pr p {
      color: var(--mu);
      font-size: .92rem;
      margin: 0 0 16px
    }

    .meta {

      justify-content: space-between;
      font-size: .82rem;
      color: var(--mu);
      font-family: 'JetBrains Mono', monospace

    .dot {

      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      background: var(--g)

    .tl {

      padding-left: 24px

    .it {
      position: relative;
      margin-bottom: 26px

    .it::before {
      content: "";
      position: absolute;
      left: -31px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--a);
      box-shadow: 0 0 0 5px rgba(109, 74, 255, .2)

      font-family: 'JetBrains Mono', monospace

    .it p {

    .pop {

    }

    @keyframes pop {
      from {

        transform: scale(.85) translateY(10px)

    }

    .chip {
      font-size: .9rem;
      padding: 7px 15px;
      transition: .2s
    }

    .chip:hover {

      gap: 16px

    .lg {
      padding: 22px
    }

    .lg small {
      color: var(--mu)
    }

      justify-content: space-between;

      font-size: .8rem;
      padding: 3px 12px;
      border-radius: 100px;
      background: rgba(0, 194, 168, .15);
      color: var(--b)
    }

    .bar {
      height: 10px;
      border-radius: 10px;
      background: var(--bd);
      margin-top: 14px;
      overflow: hidden

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--a), var(--c));

    .lg.hl {

      box-shadow: 0 0 0 1px var(--c), var(--sh)

      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: dr 2s .2s forwards
    }

    @keyframes dr {
      to {
        stroke-dashoffset: 0
      }
    }

    .pt {
      animation: pop .5s both
    }

    .pr {
      transition: transform .15s, border-color .3s
    }

    .copy {
      font: inherit;
      background: none;
      border: 1px dashed var(--a);

      padding: 6px 16px;
      cursor: pointer;

    }

      font-size: 1.3rem

    .feat::before {

    .lk a {

    }

    .lk a:hover {

    .lk .live {

      background: none;
      color: var(--mu);
      padding: 5px 9px;
      border-radius: 100px;
      cursor: pointer

    .lb.on {
      background: linear-gradient(90deg, var(--a), var(--c));
      color: #fff
    }
  </style>
</head>

        skillsH: "Ko‘nikmalar", cats: { prog: "Dasturlash", analysis: "Ma’lumotlar tahlili", viz: "Vizualizatsiya", ml: "Machine Learning", tools: "Asboblar", front: "Frontend" },
        langsH: "Tillar", projH: "Eng yaxshi loyihalar", all: "Hammasi", best: "★ Eng yaxshi", repos: "Jami 64 ta repozitoriya →",
        expH: "Tajriba va ta’lim", contactH: "Birgalikda ishlaymiz?", copied: "Nusxalandi ✓", theme: "Mavzu"
      },
      en: {
        nav: ["Skills", "Languages", "Projects", "Experience", "Contact"], tag: "● Now: Data Scientist Intern at Unicon.uz", hello: "Hi, I’m",
        roles: ["Data Scientist", "Data Analyst", "ML Enthusiast", "Frontend Developer"],
        bio: "A developer with a frontend background growing in Data Science. I turn data into useful insights with Python, SQL, Pandas and machine learning.",
        b1: "My projects", b2: "Get in touch", st: ["GitHub repos", "Frontend", "Languages"], yr: "yr",
        skillsH: "Skills", cats: { prog: "Programming", analysis: "Data Analysis", viz: "Visualization", ml: "Machine Learning", tools: "Tools", front: "Frontend" },
        langsH: "Languages", projH: "Featured projects", all: "All", best: "★ Featured", repos: "All 64 repositories →",
        expH: "Experience & education", contactH: "Let’s work together?", copied: "Copied ✓", theme: "Theme"
      },
      ru: {
        nav: ["Навыки", "Языки", "Проекты", "Опыт", "Контакты"], tag: "● Сейчас: стажёр Data Scientist в Unicon.uz", hello: "Привет, я",
        roles: ["Data Scientist", "Data Analyst", "ML-энтузиаст", "Frontend-разработчик"],
        bio: "Разработчик с опытом во frontend, развивающийся в Data Science. С помощью Python, SQL, Pandas и машинного обучения извлекаю из данных полезные выводы.",
        b1: "Мои проекты", b2: "Связаться", st: ["репозиториев", "Frontend", "Языка"], yr: "год",
        skillsH: "Навыки", cats: { prog: "Программирование", analysis: "Анализ данных", viz: "Визуализация", ml: "Машинное обучение", tools: "Инструменты", front: "Frontend" },
        langsH: "Языки", projH: "Лучшие проекты", all: "Все", best: "★ Лучший", repos: "Все 64 репозитория →",
        expH: "Опыт и образование", contactH: "Давайте работать вместе?", copied: "Скопировано ✓", theme: "Тема"
      }
    };
    /* ==================================== */

    const Ctx = React.createContext(null);
    const useI = () => React.useContext(Ctx);

    function Nav({ toggle }) {
      const { lang, t, setLang } = useI();
      const ids = ["skills", "langs", "projects", "exp", "contact"];
      return html`<nav class="wrap"><span class="logo">JA</span>
    <span>${ids.map((id, i) => html`<a href=${"#" + id}>${t.nav[i]}</a>`)}
    <span class="lang">${["uz", "en", "ru"].map(c => html`<button class=${"lb" + (c === lang ? " on" : "")} onClick=${() => setLang(c)}>${c.toUpperCase()}</button>`)}</span>
    <button class="t" onClick=${toggle} aria-label=${t.theme}>◐</button></span></nav>`;
    }

    function Count({ to }) {
      const [v, setV] = useState(0);
      useEffect(() => {
        let i = 0;
        const id = setInterval(() => { i++; setV(Math.round(to * i / 30)); if (i >= 30) clearInterval(id); }, 40);
        return () => clearInterval(id);
      }, [to]);
      return v;
    }

    function Typer({ words }) {
      const [i, setI] = useState(0), [t, setT] = useState(""), [d, setD] = useState(false);
      useEffect(() => {
        const w = words[i];
        let ms = d ? 40 : 90;
        if (!d && t === w) ms = 1400;
        const id = setTimeout(() => {
          if (!d) { if (t === w) setD(true); else setT(w.slice(0, t.length + 1)); }
          else { if (t.length === 0) { setD(false); setI((i + 1) % words.length); } else setT(t.slice(0, -1)); }
        }, ms);
        return () => clearTimeout(id);
      }, [t, d, i]);
      return html`<span class="typer">${t}</span>`;
    }

    function Viz() {
      const { t } = useI();
      const pts = [20, 55, 38, 80, 62, 110, 95, 140];
      const d = pts.map((p, i) => `${i ? "L" : "M"}${20 + i * 40},${170 - p}`).join(" ");
      return html`<div class="glass viz fade">
    <svg viewBox="0 0 320 190">
      <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#6d4aff"/><stop offset="1" stop-color="#00c2a8"/></linearGradient></defs>
      ${[0, 1, 2, 3].map(i => html`<line x1="10" x2="310" y1=${40 + i * 40} y2=${40 + i * 40} stroke="currentColor" opacity=".1"/>`)}
      <path class="draw" d=${d} fill="none" stroke="url(#lg)" stroke-width="4" stroke-linecap="round"/>
      ${pts.map((p, i) => html`<circle class="pt" style=${{ animationDelay: (0.2 * i + 0.4) + "s" }} cx=${20 + i * 40} cy=${170 - p} r="5" fill="#ff5fa2"/>`)}
    </svg>
    <div class="stats"><div><b><${Count} to=${64}/></b><span>${t.st[0]}</span></div><div><b><${Count} to=${1}/> ${t.yr}</b><span>${t.st[1]}</span></div><div><b><${Count} to=${3}/></b><span>${t.st[2]}</span></div></div>
  </div>`;
    }

    function Skills() {
      const { t } = useI();
      const [k, setK] = useState(SKILLS[0].id);
      const cur = SKILLS.find(x => x.id === k);
      return html`<section id="skills" class="rv"><h2>${t.skillsH}</h2>
    <div class="tabs">${SKILLS.map(x => html`<button class=${"tab" + (x.id === k ? " on" : "")} onClick=${() => setK(x.id)}>${t.cats[x.id]}</button>`)}</div>
    <div class="glass sk" key=${k}>${cur.items.map((s, i) => html`<span class="chip pop" style=${{ animationDelay: i * 70 + "ms" }}>${s}</span>`)}</div>
  </section>`;
    }

    function Languages() {
      const { t, lang } = useI();
      return html`<section id="langs" class="rv"><h2>${t.langsH}</h2>
    <div class="langs">${LANGS.map(x => html`
      <div class=${"glass lg" + (x.id === "ru" ? " hl" : "")}>
        <div class="lt"><b>${x.n[lang]}</b><span class="lvl">${x.c[lang]}</span></div>
        <small>${x.l[lang]}</small>
        <div class="bar"><i style=${{ "--w": x.p + "%" }}></i></div>
      </div>`)}</div>
  </section>`;
    }

    function Projects() {
      const { t, lang } = useI();
      const tilt = e => {
        const el = e.currentTarget, r = el.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        el.style.transform = `perspective(700px) rotateY(${x * 10}deg) rotateX(${-y * 10}deg) translateY(-6px)`;
      };
      const reset = e => { e.currentTarget.style.transform = ""; };
      return html`<section id="projects" class="rv"><h2>${t.projH}</h2>
    <div class="projects">${PROJECTS.map(p => html`
      <article key=${p.name} class=${"glass pr pop" + (p.feat ? " feat" : "")} style=${{ "--g": p.g }} onMouseMove=${tilt} onMouseLeave=${reset}>
        <span class="meta"><span><i class="dot"></i>AI / Data Science · Jupyter Notebook</span>${p.feat ? html`<span class="star">${t.best}</span>` : null}</span>
        <h3>${p.name}</h3><p>${p.desc[lang]}</p>
        ${p.tags ? html`<div class="tg">${p.tags.map(x => html`<span class="chip">${x}</span>`)}</div>` : null}
        ${p.metric ? html`<div class="mt">${p.metric}</div>` : null}
        <div class="meta lk"><a href=${`https://github.com/${PROFILE.github}/${p.name}`} target="_blank" rel="noopener">GitHub →</a></div>
      </article>`)}</div>
    <p style=${{ textAlign: "center", marginTop: 26 }}><a class="btn s" href=${`https://github.com/${PROFILE.github}?tab=repositories`} target="_blank" rel="noopener">${t.repos}</a></p>
  </section>`;
    }

    function pickLang() {
      try { const v = localStorage.getItem("lang"); if (I18N[v]) return v; } catch (e) { }
      const n = (navigator.language || "uz").slice(0, 2);
      return I18N[n] ? n : "uz";
    }

    function App() {
      const [theme, setTheme] = useState(null);
      const [lang, setLangState] = useState(pickLang);
      const [copied, setCopied] = useState(false);
      const t = I18N[lang];
      const setLang = c => { setLangState(c); try { localStorage.setItem("lang", c); } catch (e) { } };
      useEffect(() => { document.documentElement.lang = lang; }, [lang]);
      useEffect(() => { if (theme) document.documentElement.setAttribute("data-theme", theme); }, [theme]);
      useEffect(() => {
        const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); }), { threshold: .12 });
        document.querySelectorAll(".rv").forEach(el => io.observe(el));
        const mv = e => { document.documentElement.style.setProperty("--mx", e.clientX + "px"); document.documentElement.style.setProperty("--my", e.clientY + "px"); };
        addEventListener("mousemove", mv);
        return () => { io.disconnect(); removeEventListener("mousemove", mv); };
      }, []);
      const toggle = () => {
        const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        setTheme(dark ? "light" : "dark");
      };
      const copy = () => {
        try { navigator.clipboard.writeText(PROFILE.email); } catch (e) { }
        setCopied(true); setTimeout(() => setCopied(false), 1800);
      };
      return html`<${Ctx.Provider} value=${{ lang, t, setLang }}><div>
    <div class="glow"></div>
    <${Nav} toggle=${toggle}/>
    <main class="wrap">
      <header class="hero">
        <div class="fade">
          <span class="tag">${t.tag}</span>
          <h1>${t.hello} <span class="grad">${PROFILE.name}</span><br/><${Typer} key=${lang} words=${t.roles}/></h1>
          <p>${t.bio}</p>
          <a class="btn p" href="#projects">${t.b1}</a>
          <a class="btn s" href="#contact">${t.b2}</a>
        </div>
        <${Viz}/>
      </header>
      <${Skills}/>
      <${Languages}/>
      <${Projects}/>
      <section id="exp" class="rv"><h2>${t.expH}</h2>
        <div class="tl">${EXP.map(e => html`<div class="it"><small>${e.y[lang]}</small><h3>${e.t}</h3><p>${e.d[lang]}</p></div>`)}</div>
      </section>
      <section id="contact" class="rv"><div class="glass contact">
        <h2 style=${{ margin: 0 }}>${t.contactH}</h2>
        <p><button class="copy" onClick=${copy}>${copied ? t.copied : PROFILE.email + " ⧉"}</button><br/>${PROFILE.phone}</p>
        <a class="btn p" href=${`https://github.com/${PROFILE.github}`} target="_blank" rel="noopener">GitHub</a>
        <a class="btn s" href=${PROFILE.linkedin} target="_blank" rel="noopener">LinkedIn</a>
        <a class="btn s" href=${PROFILE.telegram} target="_blank" rel="noopener">Telegram @Abdisoatov03</a>
      </div></section>
    </main>
    <footer>© 2026 ${PROFILE.name}</footer>
  </div><//>`;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
  </script>
</body>

</html>
